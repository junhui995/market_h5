# 市场部企微 H5 · 部署示例（nginx 反代）
#
# 部署结构：
#   - 前端 index.html + 静态资源 放 /var/www/market-h5/
#   - 后端 server.py 监听 127.0.0.1:8766（仅内网）
#   - nginx 对外暴露 80/443，把 /api/ 反代到后端，并强制注入 X-MH5-Key
#     （Key 由服务端保管，前端不持有，杜绝跨用户读取）
#
# 使用：把本文件 include 进 nginx.conf 的 http 段，或放到 conf.d/market-h5.conf

server {
    listen 80;
    server_name mh5.your-domain.com;   # 改成你的企微可信域名

    root /var/www/market-h5;
    index index.html;

    # 静态前端
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端接口：nginx 注入 Key，前端无需携带
    location /api/ {
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-MH5-Key "REPLACE_WITH_STRONG_KEY";  # 与后端 MH5_API_KEY 一致
        proxy_read_timeout 60s;
    }
}
